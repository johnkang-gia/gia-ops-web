<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>GIA 구글챗</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  #fallback { display: none; padding: 14px; font: 13px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; color: #334155; }
</style>
</head>
<body>
  <!-- 패널 안의 도구 줄과 구글챗 iframe 은 운영앱이 그립니다(/chatpanel/panel). 그래서 패널 화면을 고칠 때 확장을 다시 깔지 않습니다 -
       패널을 다시 열면 운영앱이 배포한 최신 화면이 뜹니다. 확장이 직접 가진 것은 «사이드패널을 열고 머리글을 벗기는» 일뿐입니다. -->
  <iframe id="shell" src="https://gia-ops.vercel.app/chatpanel/panel" allow="clipboard-read; clipboard-write; notifications; microphone; camera"></iframe>
  <div id="fallback">운영앱(gia-ops.vercel.app)에 닿지 못했습니다. 인터넷 연결을 확인하거나 <a href="https://chat.google.com/" target="_blank">구글챗을 새 탭으로</a> 여세요.</div>
  <script>
    const f = document.getElementById("shell");
    f.addEventListener("error", () => { document.getElementById("fallback").style.display = "block"; });
  </script>
</body>
</html>
