# Supabase 스키마 자동 반영
#
# 그동안은 새 기능을 배포할 때마다 SQL을 Supabase SQL Editor에 직접 붙여넣어야 했습니다.
# 이제 main에 머지되면 이 워크플로가
# supabase/migrations 폴더의 "아직 반영되지 않은 파일만" 자동으로 실행합니다.
#
# 어떻게 중복 실행을 막나요?
#   Supabase CLI가 원격 DB에 supabase_migrations.schema_migrations 라는 기록표를 만들어두고,
#   이미 실행한 파일 이름(앞의 숫자 = 버전)을 적어둡니다. 다음 실행 때는 그 표에 없는 파일만
#   골라서 실행하므로, 워크플로가 여러 번 돌아도 같은 SQL이 두 번 실행되지 않습니다.
#
# 새 마이그레이션은 어떻게 추가하나요?
#   supabase/migrations/ 에 `YYYYMMDDHHMMSS_설명.sql` 형식으로 파일을 하나 추가하면 됩니다
#   (예: 20260901090000_add_notice_pin.sql). 앞의 14자리 숫자가 실행 순서를 정합니다.
#   supabase/schema.sql 은 전체 구조를 한눈에 보는 참고 문서로 계속 유지하고, 같은 내용을
#   그쪽에도 덧붙여 둡니다.

name: Supabase 마이그레이션

on:
  push:
    branches: [main]
    # 마이그레이션 파일이 바뀐 커밋에서만 돌립니다(코드만 고친 배포에서는 그냥 넘어갑니다).
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  # 필요할 때 GitHub의 Actions 탭에서 직접 실행할 수도 있게 열어둡니다.
  workflow_dispatch:
    inputs:
      mode:
        description: "apply = 안 돌린 SQL 실행 / baseline = 지금 파일 전부를 '이미 돌린 것'으로 표시(실행하지 않음)"
        required: true
        default: apply
        type: choice
        options: [apply, baseline]

# 같은 시간에 두 번 돌아 서로 같은 SQL을 실행하는 일이 없도록 한 번에 하나만 돌립니다.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 시크릿을 아직 등록하지 않았다면 실패(빨간 X) 대신 안내만 남기고 조용히 넘어갑니다.
      - name: 시크릿 등록 여부 확인
        id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL 시크릿이 없어 마이그레이션을 건너뜁니다. 저장소 Settings > Secrets and variables > Actions 에서 등록해주세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Supabase CLI 설치
        if: steps.check.outputs.ready == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # 원격 DB가 어떤 파일을 이미 반영했다고 보고 있는지 먼저 확인합니다. 실패했을 때
      # "어디까지 갔는지"를 아는 것이 원인 파악의 절반입니다.
      - name: 반영 현황 확인
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          {
            echo "## 반영 현황"
            echo '```'
            supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 기록표와 파일이 어긋난 것을 먼저 맞춥니다 ────────────────────────────
      #
      # 원격 기록표에는 있는데 **로컬에 파일이 없는** 버전이 하나라도 있으면, CLI 는
      # 아무것도 실행하지 않고 통째로 거절합니다. 실제로 이 저장소가 그 상태로
      # **91번 연속 실패**하고 있었습니다 - 20260824160000 하나 때문에.
      #
      #   Remote migration versions not found in local migrations directory.
      #
      # 파일이 없으니 그 SQL 을 다시 만들 수도, 되돌릴 수도 없습니다. 남은 방법은 기록만
      # 지우는 것입니다(`--status reverted`). 실제 DB 는 건드리지 않습니다.
      #
      # 사람이 알아채고 손으로 고치기를 기다리면 그동안 모든 마이그레이션이 멈춥니다.
      # 그래서 자동으로 맞춥니다.
      - name: 기록표 자동 정리
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          # 기록표를 **직접 읽습니다.**
          #
          # 처음에는 `supabase migration list` 의 표를 잘라 썼는데, 그 표는 사람이 보라고
          # 그린 것이라 화면인지 파일인지에 따라 모양이 바뀝니다(작업기계에서는 선 문자가
          # 아예 안 나왔고, 그래서 찾은 것이 하나도 없었습니다).
          # 기록은 그냥 표 하나이므로 그 표를 읽으면 됩니다.
          psql "$SUPABASE_DB_URL" -Atc \
            "select version from supabase_migrations.schema_migrations order by version" \
            > /tmp/remote.txt
          ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort > /tmp/local.txt
          # 원격에는 있는데 로컬에 파일이 없는 버전.
          comm -23 <(sort /tmp/remote.txt) /tmp/local.txt > /tmp/orphans.txt
          if [ ! -s /tmp/orphans.txt ]; then
            echo "어긋난 기록 없음 (원격 $(wc -l < /tmp/remote.txt)개 · 로컬 $(wc -l < /tmp/local.txt)개)"
          else
            {
              echo "## 기록표 자동 정리"
              echo "로컬에 파일이 없는데 원격 기록에만 남아 있던 버전입니다. 기록만 지웠고 DB 는 그대로입니다."
              echo '```'
              cat /tmp/orphans.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while read -r v; do
              [ -z "$v" ] && continue
              echo "정리: $v"
              supabase migration repair --status reverted "$v" --db-url "$SUPABASE_DB_URL"
            done < /tmp/orphans.txt
          fi

      # ── 베이스라인 ──────────────────────────────────────────────────────────
      #
      # 손으로 SQL 을 돌려온 DB 를 자동 실행으로 넘길 때 딱 한 번 필요합니다.
      # 지금 있는 파일을 **실행하지 않고** "이미 돌린 것"으로만 표시합니다. 이걸 안 하면
      # 자동 실행 첫날에 39개가 한꺼번에 돌면서, 이미 손으로 돌린 것까지 다시 실행됩니다
      # (그중에는 배정을 지우고 다시 넣는 파일도 있습니다).
      - name: 베이스라인 (실행하지 않고 표시만)
        if: steps.check.outputs.ready == 'true' && inputs.mode == 'baseline'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          {
            echo "## 베이스라인"
            echo "아래 버전을 **실행하지 않고** 이미 반영된 것으로 표시했습니다."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for f in supabase/migrations/*.sql; do
            v=$(basename "$f" | cut -d_ -f1)
            supabase migration repair --status applied "$v" --db-url "$SUPABASE_DB_URL"
            echo "  · $v $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 실패하면 오류 문구를 실행 결과 요약(Summary)에 그대로 남깁니다. 로그를 펼쳐 찾지 않아도
      # 실행 페이지 첫 화면에서 바로 보이도록 하기 위해서입니다 - 예전에는 빨간 X만 뜨고
      # "Process completed with exit code 1"밖에 안 보여서 원인을 알 수 없었습니다.
      - name: 마이그레이션 적용
        id: push
        if: steps.check.outputs.ready == 'true' && inputs.mode != 'baseline'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          # `--include-all` 은 쓰지 않습니다.
          #
          # 한 번 켜봤다가 실패했습니다. 그 깃발은 기록에 없는 파일을 **시간 순서를 무시하고
          # 전부** 실행하는데, 손으로 돌려온 기간이 길어서 그 안에 이미 적용된 자료 작업이
          # 섞여 있었습니다. 두 번째 실행에서 앞뒤가 안 맞아 멈춥니다.
          #
          # 지금 상태에서 필요한 것은 **베이스라인**입니다(위 단계). 한 번 표시해 두면
          # 그다음부터는 새로 만든 파일만 순서대로 적용되므로 이 깃발이 필요 없습니다.
          supabase db push --db-url "$SUPABASE_DB_URL" 2>&1 | tee /tmp/push.log
          code=${PIPESTATUS[0]}
          {
            echo "## 마이그레이션 적용 결과"
            if [ "$code" -eq 0 ]; then
              echo "성공했습니다."
            else
              echo "**실패했습니다. 아래 문구를 그대로 전달해주세요.**"
            fi
            echo '```'
            tail -n 60 /tmp/push.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
