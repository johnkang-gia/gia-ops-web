<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>GIA 구글챗</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  #bar { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; background: #0f172a; color: #fff; font-size: 12px; }
  #bar a, #bar button { color: #cbd5e1; font-size: 11px; background: none; border: 1px solid #334155; border-radius: 6px; padding: 2px 6px; cursor: pointer; text-decoration: none; }
  #bar a:hover, #bar button:hover { background: #1e293b; color: #fff; }
  #frame { width: 100%; height: calc(100% - 30px); border: 0; }
  #help { display: none; padding: 14px; font-size: 13px; line-height: 1.6; color: #334155; }
</style>
</head>
<body>
  <div id="bar">
    <b>💬 구글챗</b>
    <button id="reload" title="다시 불러오기">↻</button>
    <a id="tab" href="https://chat.google.com/" target="_blank" title="새 탭으로 열기">새 탭 ↗</a>
    <span style="margin-left:auto;opacity:.6">GIA 수집기 2.7</span>
  </div>
  <iframe id="frame" src="https://chat.google.com/" allow="clipboard-read; clipboard-write; notifications; microphone; camera"></iframe>
  <div id="help">
    화면이 비어 있거나 로그인 화면이 반복되면: ① 위 「새 탭 ↗」로 구글챗에 한 번 로그인한 뒤 ② 「↻」를 누르세요.
    크롬 설정에서 서드파티 쿠키를 모두 차단해 두면 이 창 안에서는 로그인이 유지되지 않습니다 - chrome://settings/cookies 에서
    「시크릿 모드에서만 차단」으로 두거나 chat.google.com 을 허용 목록에 넣으세요.
  </div>
  <script>
    // 로그인이 안 된 채로 끼워 넣으면 구글이 accounts.google.com 안에서 막아 버립니다(frame-busting). 그때는 안내만 띄웁니다.
    const frame = document.getElementById("frame");
    document.getElementById("reload").addEventListener("click", () => { frame.src = "https://chat.google.com/"; });
    let shown = false;
    setTimeout(() => {
      try {
        // 같은 출처가 아니면 접근 자체가 막히는데, 그건 정상입니다(구글챗이 떠 있다는 뜻).
        void frame.contentWindow.location.href;
        if (!shown) { document.getElementById("help").style.display = "block"; shown = true; }
      } catch { /* 정상 */ }
    }, 4000);
  </script>
</body>
</html>
